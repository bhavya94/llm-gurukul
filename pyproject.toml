[project]
name = "llm-gurukul"
version = "0.1.0"
description = "A small language model goes to school: one model, trained by hand, learns eight abilities, from writing text to resisting attacks."
readme = "README.md"
authors = [{ name = "Bhavya Sharma" }]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "pyarrow>=26.0.1",
    "tokenizers>=0.23.3",
]

[project.scripts]
vak = "vak.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# One package per folder at the top of the repo: medha, the shared model, and one per ability.
module-name = ["medha", "vak"]
module-root = ""

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]
